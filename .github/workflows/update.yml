name: Update departure board
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
  push: { branches: [main], paths: ["scripts/**"] }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build-board.mjs
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}", GH_USER: "${{ github.repository_owner }}" }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add board.svg
          git diff --cached --quiet || git commit -m "chore: update departure board" && git push
